version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: bth_test_task
      DB_USERNAME: postgres
      DB_PASSWORD: pass123

  web:
    image: nginx:1.27-alpine
    container_name: web
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bth_test_task
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
